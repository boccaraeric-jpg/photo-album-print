<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icône v7 : monogramme « CC » de ComClic seul, sienne, dimensionné pour
       remplir le cercle de visée extérieur (arcs r 166, centres x 338 et 686,
       stroke 84). L'appareil photo en arrière-plan a été retiré : il alourdissait
       le dessin sans rien apporter. Cercles de visée conservés. -->
  <defs>
    <linearGradient id="cc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4602C"/>
      <stop offset="1" stop-color="#8E3F1B"/>
    </linearGradient>
    <filter id="softer" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A2A12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FBF4EA"/>
  <!-- Cercles de visée : trait épais et bien opaque, sinon ils disparaissent
       une fois l'icône réduite à la taille d'une app. -->
  <g stroke="#B9764F" fill="none" opacity="0.65">
    <circle cx="512" cy="512" r="392" stroke-width="11"/>
    <circle cx="512" cy="512" r="300" stroke-width="8"/>
    <path d="M120 512 H904" stroke-width="2"/>
    <path d="M512 120 V904" stroke-width="2" stroke-dasharray="26 20"/>
    <path d="M232 232 L792 792 M792 232 L232 792" stroke-width="2" stroke-dasharray="20 26" opacity="0.55"/>
  </g>
  <g filter="url(#softer)">
    <g fill="none" stroke="url(#cc)" stroke-width="84" stroke-linecap="round">
      <path d="M445 385 A 166 166 0 1 0 445 639"/>
      <path d="M793 385 A 166 166 0 1 0 793 639"/>
    </g>
  </g>
</svg>
